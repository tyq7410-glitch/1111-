name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # If the src folder was not uploaded, but the project .zip was, unpack the zip.
      - name: Unpack project zip (only if src is missing)
        run: |
          if [ -d src/main/java ]; then
            echo "src/main/java is already in the repository, nothing to unpack"
          else
            ZIP=$(find . -maxdepth 3 -iname '*.zip' -not -path './.git/*' | head -1)
            if [ -n "$ZIP" ]; then
              echo "Unpacking $ZIP"
              mkdir -p _unzipped
              unzip -q -o "$ZIP" -d _unzipped
            else
              echo "No .zip found in the repository"
            fi
          fi

      # Works even if the project is inside a subfolder or an unpacked zip.
      - name: Find the project folder
        id: proj
        run: |
          echo "--- files in the repository ---"
          find . -not -path './.git/*' -type f | head -60
          DIR=""
          for f in $(find . -name build.gradle -not -path './.git/*'); do
            d=$(dirname "$f")
            if [ -d "$d/src/main/java" ]; then DIR="$d"; break; fi
          done
          if [ -z "$DIR" ]; then
            echo "::error::The src/main/java folder was not found. Upload the project zip (AuroraCheatClient.zip) to the repository root, or drag the whole src folder into the repository."
            exit 1
          fi
          echo "Project folder: $DIR"
          echo "Java files: $(find "$DIR/src" -name '*.java' | wc -l) (expected 25)"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      # No gradle wrapper in the repo, so Gradle is installed by the action.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle build --no-daemon --stacktrace

      # Fails loudly instead of uploading a tiny/empty jar.
      - name: Check the jar
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          ls -la build/libs
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' | head -1)
          SIZE=$(stat -c%s "$JAR")
          CLASSES=$(unzip -l "$JAR" | grep -c '\.class' || true)
          echo "jar: $JAR  size: $SIZE bytes  classes: $CLASSES"
          if [ "$SIZE" -lt 50000 ] || [ "$CLASSES" -lt 50 ]; then
            echo "::error::The jar is too small ($SIZE bytes, $CLASSES classes). The build is incomplete."
            exit 1
          fi
          mkdir -p dist
          cp "$JAR" dist/aurora-cheat-client.jar

      - name: Upload jar (Actions -> Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: aurora-cheat-client
          path: ${{ steps.proj.outputs.dir }}/dist/aurora-cheat-client.jar
          if-no-files-found: error

      - name: Publish release (when you push a tag like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.proj.outputs.dir }}/dist/aurora-cheat-client.jar
